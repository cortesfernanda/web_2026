<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encargo 3 — Presentación</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0d1b2a;
            color: #e0e1dd;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .placeholder-card {
            max-width: 650px;
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px dashed rgba(144, 224, 239, 0.3);
            border-radius: 20px;
            padding: 3.5rem 2.5rem;
            text-align: center;
            backdrop-filter: blur(10px);
        }
        .placeholder-icon {
            width: 56px;
            height: 56px;
            margin: 0 auto 1.5rem;
            color: #90e0ef;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 180, 216, 0.1);
            border-radius: 50%;
            border: 1px solid rgba(0, 180, 216, 0.25);
        }
        .placeholder-icon svg {
            width: 28px;
            height: 28px;
        }
        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 0.75rem;
            letter-spacing: -0.02em;
        }
        p {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #a0aec0;
            margin-bottom: 1.5rem;
        }
        .placeholder-tag {
            display: inline-block;
            background: rgba(144, 224, 239, 0.1);
            border: 1px solid rgba(144, 224, 239, 0.25);
            color: #90e0ef;
            padding: 0.4rem 1.2rem;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.04em;
        }
    </style>
</head>
<body>
    <div class="placeholder-card">
        <div class="placeholder-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="12" y1="18" x2="12" y2="12"></line>
                <line x1="9" y1="15" x2="15" y2="15"></line>
            </svg>
        </div>
        <h1>Encargo 3</h1>
        <p>Espacio preparado para integrar el contenido, interacción o maqueta correspondiente al Encargo 3.</p>
        <span class="placeholder-tag">Listo para contenido</span>
    </div>
</body>
</html>
