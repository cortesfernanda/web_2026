<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none" role="img" aria-label="Escudo Ilustre Municipalidad de Putaendo">
  <!-- Escudo Heráldico de Putaendo -->
  <g id="escudo" transform="translate(10, 4) scale(0.95)">
    <!-- Corona mural (3 almenas) -->
    <path d="M12 18 L12 8 L18 8 L18 12 L24 12 L24 8 L30 8 L30 12 L36 12 L36 8 L42 8 L42 18 Z" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
    
    <!-- Contorno del escudo -->
    <path d="M10 20 H44 C44 42 38 56 27 64 C16 56 10 42 10 20 Z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Línea divisoria en cruz del escudo -->
    <line x1="10" y1="36" x2="44" y2="36" stroke="currentColor" stroke-width="1.8"/>
    <line x1="27" y1="20" x2="27" y2="63" stroke="currentColor" stroke-width="1.8"/>
    
    <!-- Cuartel superior izquierdo: Estrella radiante -->
    <path d="M18.5 24 L19.5 27 L22.5 28 L19.5 29 L18.5 32 L17.5 29 L14.5 28 L17.5 27 Z" fill="currentColor"/>
    
    <!-- Cuartel superior derecho: Símbolo heráldico (Flor de lis / Espiga) -->
    <path d="M35.5 23 C35.5 26 33.5 29 35.5 33 C37.5 29 35.5 26 35.5 23 Z" fill="currentColor"/>
    <path d="M32.5 27 C34 28 35 30 35 32" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M38.5 27 C37 28 36 30 36 32" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
    
    <!-- Cuartel inferior izquierdo: Barras diagonales -->
    <line x1="12" y1="50" x2="25" y2="38" stroke="currentColor" stroke-width="1.8"/>
    <line x1="14" y1="56" x2="27" y2="44" stroke="currentColor" stroke-width="1.8"/>
    <line x1="20" y1="59" x2="27" y2="52" stroke="currentColor" stroke-width="1.8"/>
    
    <!-- Cuartel inferior derecho: Cruz patada heráldica -->
    <path d="M35.5 40 V54 M29 47 H42" stroke="currentColor" stroke-width="2" stroke-linecap="square"/>
    <circle cx="35.5" cy="47" r="1.8" fill="currentColor"/>
  </g>

  <!-- Tipografía Oficial -->
  <text x="68" y="44" font-family="'Proxima Nova', 'ProximaNova', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" font-weight="800" letter-spacing="1.5" fill="currentColor">PUTAENDO</text>
  <text x="70" y="62" font-family="'Proxima Nova', 'ProximaNova', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="500" letter-spacing="0.8" fill="currentColor" opacity="0.92">Ilustre Municipalidad</text>
</svg>
